spring.application.name=accounting
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounting_db}
spring.datasource.username=${DB_USERNAME:accounting}
spring.datasource.password=${DB_PASSWORD:accounting}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=8080
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456}
app.jwt.expiration-ms=86400000
