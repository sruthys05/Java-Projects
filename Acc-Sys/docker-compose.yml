services:
  postgres:
    image: postgres:16
    container_name: accounting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
    ports:
      - "5432:5432"
    volumes:
      - accounting-data:/var/lib/postgresql/data

volumes:
  accounting-data:
